<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>JARVIS</title>
<style>
  /* 背景纯黑：配合 LWA_COLORKEY 颜色键，所有黑色像素变透明露出桌面。
     青色文字/粒子不是纯黑，不受影响。 */
  html, body { margin:0; padding:0; height:100%; background:#000000; overflow:hidden; user-select:none; }
  #rain { position:fixed; inset:0; }
  #dust { position:fixed; inset:0; }
  /* ---- 顶部状态条（全息 HUD）---- */
  #status {
    position:fixed; top:14px; left:0; right:0; text-align:center;
    font-family:'Segoe UI','Microsoft YaHei',sans-serif;
    font-size:11px; letter-spacing:5px; color:#00F0FF; text-transform:uppercase;
    text-shadow:0 0 10px rgba(0,240,255,.9);
    display:flex; justify-content:center; align-items:center; gap:10px;
  }
  #status .dot { width:7px; height:7px; border-radius:50%; background:#00F0FF;
    box-shadow:0 0 9px #00F0FF; animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%,100%{opacity:.2} 50%{opacity:1} }
  /* ---- 消息区（无面板：文字直接浮在桌面上）---- */
  #messages {
    position:fixed; left:6%; right:6%; top:0; bottom:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:4vh; pointer-events:none;
  }
  .msg {
    max-width:72vw; text-align:center; white-space:pre-wrap; word-break:break-word;
    font-family:'Segoe UI','Microsoft YaHei',sans-serif; line-height:1.55;
    padding:14px 38px; border-radius:16px;
    background:rgba(0,8,14,.52); box-shadow:0 0 24px rgba(0,0,0,.35);
    transition:opacity 1.2s;
  }
  .msg .who {
    font-size:12px; letter-spacing:4px; margin-bottom:6px; opacity:.85;
  }
  /* 用户输入：30px 全息青色霓虹 */
  .msg.user {
    font-size:30px; color:#00F0FF;
    text-shadow:0 0 8px rgba(0,240,255,.95), 0 0 22px rgba(0,240,255,.55), 0 0 48px rgba(0,240,255,.3);
  }
  .msg.user .who { color:#7ff4ff; text-shadow:0 0 8px rgba(0,240,255,.8); }
  /* AI 回复：38px 加粗 全息青色发光 */
  .msg.assistant {
    font-size:38px; font-weight:700; color:#00F0FF;
    text-shadow:0 0 12px rgba(0,240,255,1), 0 0 30px rgba(0,240,255,.65), 0 0 70px rgba(0,240,255,.4);
  }
  .msg.assistant .who { color:#00F0FF; text-shadow:0 0 10px rgba(0,240,255,.9); }
  .cursor { display:inline-block; width:.55em; height:1.15em; background:#00F0FF;
    box-shadow:0 0 10px #00F0FF; vertical-align:-.15em; margin-left:2px; animation:pulse .7s infinite; }
  /* ---- 播报扫描线 ---- */
  #scan {
    position:fixed; left:10%; right:10%; height:2px; top:56%;
    background:linear-gradient(90deg,transparent,rgba(0,240,255,.9),transparent);
    box-shadow:0 0 18px rgba(0,240,255,.8); display:none;
  }
</style>
</head>
<body>
<canvas id="dust"></canvas>
<canvas id="rain"></canvas>
<div id="scan"></div>
<div id="status"><span class="dot"></span><span id="statusText">STANDBY · 待机</span></div>
<div id="messages"></div>
<div id="dbg" style="position:fixed;top:2px;left:2px;width:10px;height:10px;background:#ff0000;border-radius:50%;opacity:.7"></div>
<script>
// 未捕获错误显示到状态条和窗口标题，方便排查
window.addEventListener('error', e => {
  const msg = e.message || 'unknown';
  const el = document.getElementById('statusText');
  if (el) el.textContent = 'ERR ' + msg;
  document.title = 'ERR ' + msg;
  const dbg = document.getElementById('dbg');
  if (dbg) dbg.style.background = '#ff8800';   // 橙色=有错误
});

// ================= Matrix 数字雨（透明底：无轨迹层，用字符栈淡出） =================
const rain = document.getElementById('rain');
const rctx = rain.getContext('2d');
const CHARS = 'アイウエオカキクケコサシスセソ0123456789ABCDEFΞΨΦΩあいうえお';
const rainCols = [];

function initRain(){
  rain.width = window.innerWidth; rain.height = window.innerHeight;
  const fs = 15, n = Math.min(40, Math.floor(rain.width / (fs * 1.6)));
  rainCols.length = 0;
  for (let i = 0; i < n; i++)
    rainCols.push({ x:i*(rain.width/n)+Math.random()*10, y:Math.random()*rain.height,
                    speed:(1+Math.random()*2.2)*fs/3.2, chars:[], next:Math.random()*20|0 });
}
initRain(); window.addEventListener('resize', initRain);

function drawRain(t){
  rctx.clearRect(0,0,rain.width,rain.height);
  rctx.font = '14px Consolas, monospace';
  const fs = 15;
  for (const c of rainCols){
    c.y += c.speed;
    if (c.y > rain.height + c.chars.length*fs){ c.y = -Math.random()*300; c.chars.length = 0; }
    if (--c.next <= 0){ c.next = 6; c.chars.unshift(CHARS[Math.random()*CHARS.length|0]);
      if (c.chars.length > 18) c.chars.pop(); }
    for (let i = 0; i < c.chars.length; i++){
      const a = i===0 ? .75 : Math.max(0, .45 - i*.025);
      if (a <= 0.02) continue;
      rctx.fillStyle = `rgba(0,240,255,${a})`;
      rctx.fillText(c.chars[i], c.x, c.y - i*fs);
    }
  }
}

// ================= 浮动尘埃粒子 =================
const dust = document.getElementById('dust');
const dctx = dust.getContext('2d');
const dustPts = [];
function initDust(){
  dust.width = window.innerWidth; dust.height = window.innerHeight;
  dustPts.length = 0;
  for (let i = 0; i < 110; i++)
    dustPts.push({ x:Math.random()*dust.width, y:Math.random()*dust.height,
                   r:.6+Math.random()*1.8, vy:.08+Math.random()*.3, tw:Math.random()*6.28 });
}
initDust(); window.addEventListener('resize', initDust);

function drawDust(t){
  dctx.clearRect(0,0,dust.width,dust.height);
  for (const p of dustPts){
    p.y -= p.vy; if (p.y < -4){ p.y = dust.height+4; p.x = Math.random()*dust.width; }
    const a = .12 + .18*(0.5+0.5*Math.sin(t*1.3+p.tw));
    dctx.fillStyle = `rgba(140,240,255,${a})`;
    dctx.beginPath(); dctx.arc(p.x,p.y,p.r,0,6.283); dctx.fill();
  }
}

// ================= 弧反应堆圆环（在消息区后方画一层光影） =================
const ring = document.createElement('canvas');
ring.id = 'ring';
ring.style.cssText = 'position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;';
document.body.appendChild(ring);
const gctx = ring.getContext('2d');
function initRing(){
  ring.width = ring.height = Math.min(window.innerWidth, window.innerHeight)*0.62;
}
initRing(); window.addEventListener('resize', initRing);

// 状态参数平滑插值：思考↔回复切换时不跳变
let ringEnergy = 1, ringSpeed = 1;

function drawRing(t){
  gctx.clearRect(0,0,ring.width,ring.height);
  const cx = ring.width/2, R = ring.width/2;
  const target = { idle:[1,1], listening:[1.9,2.6],
                   speaking:[2.4,1.8], thinking:[1.5,3.4] }[state] || [1,1];
  ringEnergy += (target[0] - ringEnergy) * .07;
  ringSpeed  += (target[1] - ringSpeed)  * .07;
  const energy = ringEnergy, speed = ringSpeed;
  // 三层旋转弧
  const arcs = [
    { r:R*.30, w:2.5, rot:t*.55*speed, len:2.2, a:.30*energy },
    { r:R*.38, w:3.5, rot:-t*.38*speed, len:1.5, a:.42*energy },
    { r:R*.46, w:2.0, rot:t*.30*speed, len:2.8, a:.26*energy },
  ];
  for (const ar of arcs){
    gctx.strokeStyle = `rgba(0,240,255,${Math.min(1,ar.a)})`;
    gctx.lineWidth = ar.w;
    gctx.lineCap = 'round';
    gctx.shadowColor = 'rgba(0,240,255,.8)';
    gctx.shadowBlur = 12*energy;
    gctx.beginPath();
    gctx.arc(cx, cx, ar.r, ar.rot, ar.rot + ar.len + Math.sin(t*2)*.3);
    gctx.stroke();
  }
  // 内圈
  gctx.shadowBlur = 18*energy;
  gctx.strokeStyle = `rgba(0,240,255,${.28*energy})`;
  gctx.lineWidth = 1;
  gctx.beginPath(); gctx.arc(cx, cx, R*.24, 0, 6.283); gctx.stroke();
  gctx.shadowBlur = 0;
}

// ================= 状态机 =================
let state = 'idle';   // idle | listening | thinking | speaking
function setStatusText(){
  const map = { idle:['STANDBY','待机'], listening:['LISTENING','聆听中'],
                thinking:['PROCESSING','思考中'], speaking:['RESPONDING','回复中'] };
  const [en,zh] = map[state] || map.idle;
  document.getElementById('statusText').textContent = en + ' · ' + zh;
  document.getElementById('scan').style.display = (state==='speaking') ? 'block' : 'none';
}

// ================= 消息显示：霓虹打字机（逐字随机延迟） =================
const messagesBox = document.getElementById('messages');
let queue = [], typing = null, currentAssistant = null;

function addMessage(who, text){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  div.innerHTML = '<div class="who">' + (who==='user' ? 'YOU ▸ 输入' : 'JARVIS ▸ 回复') + '</div><div class="text"></div>';
  messagesBox.appendChild(div);
  // 只保留当前一轮对话（用户输入 + 贾维斯回复），历史消息直接移除，画面不堆积
  while (messagesBox.children.length > 2)
    messagesBox.removeChild(messagesBox.firstChild);
  queue.push({el: div.querySelector('.text'), text});
  if (who === 'assistant') currentAssistant = div.querySelector('.text');
  return div.querySelector('.text');
}
function appendChunk(text){
  // 流式增量：追加到当前 AI 回复的打印队列
  if (!currentAssistant) addMessage('assistant', '');
  queue.push({el: currentAssistant, text});
}
function scheduleTypeLoop(delay){ setTimeout(typeLoop, delay); }
function typeLoop(){
  if (!typing && queue.length){
    typing = queue.shift(); typing.i = 0;
    const cur = document.createElement('span'); cur.className='cursor';
    typing.el.appendChild(cur);
  }
  if (typing){
    const {el, text} = typing;
    if (typing.i < text.length){
      const c = document.createTextNode(text[typing.i++]);
      el.insertBefore(c, el.lastChild);
      scheduleTypeLoop(Math.random()*55 + 12);   // 每字 12~67ms 随机延迟
      return;
    }
    el.removeChild(el.lastChild);
    typing = null;
  }
  scheduleTypeLoop(16);
}
typeLoop();

// ================= 扫描线动画 =================
const scan = document.getElementById('scan');
let scanDir = 1, scanY = 56;
function drawScan(){
  if (state !== 'speaking') return;
  scanY += scanDir * 1.6;
  if (scanY > 68 || scanY < 50) scanDir *= -1;
  scan.style.top = scanY + '%';
}

// ================= 与 Python 后端通信 =================
function applyEvent(ev){
  if (ev.type==='state'){ state = ev.state; setStatusText(); }
  else if (ev.type==='message'){ addMessage(ev.role, ev.text); }
  else if (ev.type==='chunk'){ appendChunk(ev.text); }
  else if (ev.type==='quit'){ try{ window.close(); }catch(e){} }
}
async function poll(){
  if (window.pywebview && window.pywebview.api){
    try {
      const events = await window.pywebview.api.get_events();
      events.forEach(applyEvent);
    } catch(e){}
  }
  setTimeout(poll, 100);
}
poll();

// ================= 主循环 =================
let firstFrame = true;
function animate(){
  requestAnimationFrame(animate);
  const t = performance.now()/1000;
  drawRain(t);
  drawDust(t);
  drawRing(t);
  drawScan();
  if (firstFrame){
    firstFrame = false;
    document.title = 'JARVIS OK';                        // 渲染成功标记
    document.getElementById('dbg').style.background = '#00ff00';   // 绿色=渲染成功
  }
}
animate();
setStatusText();
</script>
</body>
</html>
